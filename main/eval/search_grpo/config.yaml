hydra:
  searchpath:
    - file://.venv/src/verl/verl/trainer/config
    - file://configs

defaults:
  - ppo_trainer
  - search_r1@search_r1_baseline: v0_2
  - search_r1@local_override: local_override
  - experiment_model: searchr1_3b
  - _self_

data:
  train_files: ${local_override.data.train_files}
  val_files: ${local_override.data.val_files}
  train_batch_size: ${search_r1_baseline.training.train_batch_size}
  val_batch_size: ${search_r1_baseline.training.val_batch_size}
  max_prompt_length: ${search_r1_baseline.rollout.max_prompt_length}
  # veRL 0.6 stores the complete interleaved rollout in one response field.
  # Each individual generation remains capped at the official 500 tokens.
  max_response_length: ${local_override.framework_compatibility.accumulated_response_length}
  filter_overlong_prompts: true
  truncation: error
  return_raw_chat: true

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ${experiment_model.path}
    trust_remote_code: ${experiment_model.trust_remote_code}
    override_config: ${experiment_model.override_config}
    enable_gradient_checkpointing: true
    use_remove_padding: ${experiment_model.use_remove_padding}
    external_lib: ${experiment_model.external_lib}
  actor:
    optim:
      lr: ${search_r1_baseline.training.learning_rate}
      lr_warmup_steps_ratio: ${search_r1_baseline.training.lr_warmup_steps_ratio}
    ppo_mini_batch_size: ${search_r1_baseline.training.ppo_mini_batch_size}
    ppo_micro_batch_size_per_gpu: ${experiment_model.ppo_micro_batch_size_per_gpu}
    use_kl_loss: ${search_r1_baseline.training.use_kl_loss}
    kl_loss_coef: ${search_r1_baseline.training.kl_loss_coef}
    kl_loss_type: ${search_r1_baseline.training.kl_loss_type}
    entropy_coeff: ${search_r1_baseline.training.entropy_coeff}
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    name: vllm
    mode: ${local_override.framework_compatibility.rollout_mode}
    dtype: ${experiment_model.dtype}
    n: ${search_r1_baseline.rollout.n_agent}
    temperature: ${search_r1_baseline.rollout.temperature}
    top_p: ${search_r1_baseline.rollout.top_p}
    tensor_model_parallel_size: ${search_r1_baseline.training.tensor_model_parallel_size}
    gpu_memory_utilization: ${search_r1_baseline.training.gpu_memory_utilization}
    max_model_len: ${experiment_model.max_model_len}
    enforce_eager: ${experiment_model.enforce_eager}
    log_prob_micro_batch_size_per_gpu: ${experiment_model.log_prob_micro_batch_size_per_gpu}
    calculate_log_probs: true
    agent:
      default_agent_loop: search_r1_v0_2_official
      agent_loop_config_path: ${local_override.framework_compatibility.agent_loop_config_path}
  ref:
    log_prob_micro_batch_size_per_gpu: ${experiment_model.log_prob_micro_batch_size_per_gpu}
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: ${search_r1_baseline.training.adv_estimator}
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

custom_reward_function:
  path: main/src/ouro_search/rewards/answer_reward.py
  name: compute_score

trainer:
  logger: [console, wandb]
  project_name: ouro-search
  experiment_name: ${experiment_model.experiment_name}
  n_gpus_per_node: ${search_r1_baseline.training.n_gpus_per_node}
  nnodes: 1
  save_freq: ${search_r1_baseline.training.save_freq}
  test_freq: ${search_r1_baseline.training.test_freq}
  total_training_steps: ${search_r1_baseline.training.total_training_steps}
  default_local_dir: ${experiment_model.checkpoint_dir}
  rollout_data_dir: ${experiment_model.trajectory_dir}

global_profiler:
  save_path: ${experiment_model.profile_dir}
