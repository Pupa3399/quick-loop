experiment_name: loop_pretest_h_residual_no_added_newlines
input_file: main/data/qwen_prefilt/search_r1_qwen3b_decision_turns_human_20.jsonl
results_dir: main/tests/loop_pretest_h_residual/results_no_added_newlines

model:
  path: main/models/searchr1/searchr1-qwen2.5-3b-grpo-v0.2
  dtype: bfloat16
  device: cuda:0
  local_files_only: true
  attention_backend: sdpa
  alpha: 0.5
  rms_epsilon: 1.0e-6

sampling:
  trajectories_per_depth: 4
  depths:
    - 1
    - 2
  base_seed: 42
  temperature: 1.0
  top_p: 1.0
  max_new_tokens_per_turn: 500
  max_response_tokens: 3000

agent:
  prompt_profile: search_r1
  prefix_whitespace_mode: no_added_newlines
  max_search_turns: 4
  max_information_tokens: 500

retriever:
  url: http://127.0.0.1:8000
  top_k: 3
  timeout_seconds: 120.0
  require_gpu_faiss: true
  expected_index_size: 21015324
