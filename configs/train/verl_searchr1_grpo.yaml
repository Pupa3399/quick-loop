hydra:
  searchpath:
    - file://third_party/verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: /data2/wuguanting/quick_loop/data/searchr1/train.parquet
  val_files: /data2/wuguanting/quick_loop/data/searchr1/test.parquet
  train_batch_size: 512
  val_batch_size: 256
  max_prompt_length: 4096
  max_response_length: 3000
  filter_overlong_prompts: true
  truncation: error
  return_raw_chat: true

actor_rollout_ref:
  hybrid_engine: true
  model:
    # Prepared locally from the immutable HF snapshot. Its effective 144-layer
    # metadata allocates an independent KV slot for every one of 48 x R3 calls.
    path: /data2/wuguanting/quick_loop/data/vllm-ouro-r3
    trust_remote_code: true
    override_config:
      total_ut_steps: 3
    enable_gradient_checkpointing: true
    use_remove_padding: false
    external_lib:
      - ouro_search.vllm_model.registry
      - ouro_search.verl.model_hooks
  actor:
    optim:
      lr: 5.0e-7
      lr_warmup_steps_ratio: 0.285
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 8
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    fsdp_config:
      param_offload: true
      grad_offload: true
      optimizer_offload: true
  rollout:
    name: vllm
    mode: async
    dtype: bfloat16
    n: 5
    temperature: 1.0
    top_p: 1.0
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.6
    max_model_len: 7096
    log_prob_micro_batch_size_per_gpu: 8
    calculate_log_probs: true
    agent:
      default_agent_loop: ouro_search_r1
      agent_loop_config_path: configs/train/agent_loop_r3.yaml
  ref:
    log_prob_micro_batch_size_per_gpu: 8
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

custom_reward_function:
  path: src/ouro_search/rewards/answer_reward.py
  name: compute_score

trainer:
  logger: [console, wandb]
  project_name: ouro-search
  experiment_name: ouro-r3-searchr1-grpo
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 100
  test_freq: 100
  total_training_steps: 1005
  default_local_dir: outputs/checkpoints/grpo-r3
  rollout_data_dir: outputs/trajectories/verl
