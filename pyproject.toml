[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ouro-search"
version = "0.1.0"
description = "Research scaffold for loop-aware search agents based on Ouro."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "datasets>=3.6,<4",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "hydra-core>=1.3.2,<2",
    "torch==2.7.1",
    "transformers==4.54.1",
    "uvicorn==0.34.3",
    "wandb>=0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
cache-dir = ".uv-cache"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
