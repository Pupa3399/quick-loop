defaults:
  - model: ouro_2_6b_r3
  - agent: default
  - search: e5_wiki18
  - _self_

evaluation:
  manifest: benchmarks/zero_shot_agent_v1.jsonl
  samples_per_dataset: 10
  profiles:
    - search_r1
    - hermes
  output_dir: outputs/evaluations/zero-shot-agent-v1-20
  failure_cases_per_class: 3

hydra:
  run:
    dir: outputs/logs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
