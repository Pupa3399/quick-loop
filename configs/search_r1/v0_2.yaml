# Search-R1 v0.2 upstream baseline.
# Source commit: 598e61bd1d36895726d28a8d06b3a15bed19f5d3
# Keep machine paths and compatibility overrides in local_override.yaml.
name: search_r1_v0_2_official
upstream_revision: 598e61bd1d36895726d28a8d06b3a15bed19f5d3

model:
  name: Qwen/Qwen2.5-7B
  dtype: bfloat16

prompt:
  template: "Answer the given question. You must conduct reasoning inside <think> and </think> first every time you get new information. After reasoning, if you find you lack some knowledge, you can call a search engine by <search> query </search> and it will return the top searched results between <information> and </information>. You can search at most four times. If you find no further external knowledge needed, you can directly provide the answer inside <answer> and </answer>, without detailed illustrations. For example, <answer> Beijing </answer>. Question: {question}\n"

rollout:
  max_turns: 4
  max_start_length: 2048
  max_prompt_length: 4096
  max_response_length: 500
  max_obs_length: 500
  n_agent: 5
  temperature: 1.0
  top_p: 1.0
  stop_strings: []
  parser: strict_first_closed_action
  invalid_action_recovery: true
  postprocess_before_parse: true
  continuous_rng_within_trajectory: true
  attention_backend: XFORMERS

retriever:
  top_k: 3
  corpus: wiki18
  encoder: intfloat/e5-base-v2
  index_type: flat

training:
  train_batch_size: 512
  val_batch_size: 256
  learning_rate: 1.0e-6
  lr_warmup_steps_ratio: 0.285
  ppo_mini_batch_size: 256
  ppo_micro_batch_size: 64
  log_prob_micro_batch_size: 128
  adv_estimator: grpo
  use_kl_loss: true
  kl_loss_coef: 0.001
  kl_loss_type: low_var_kl
  entropy_coeff: 0.0
  state_masking: true
  tensor_model_parallel_size: 1
  gpu_memory_utilization: 0.6
  n_gpus_per_node: 8
  save_freq: 100
  test_freq: 100
  total_training_steps: 1005
