# Search-R1 original: Qwen/Qwen2.5-3B. Changed for Ouro.
model:
  path: /data2/wuguanting/quick_loop/data/vllm-ouro-r3
  revision: f1edd81e7ac41355db670500ceaf204e0f73af68
  trust_remote_code: true  # changed for Ouro
  dtype: bfloat16
  total_ut_steps: 3  # changed for Ouro; fixed R3 for every rollout
  freeze_exit_gate: true  # changed for Ouro
  enable_gradient_checkpointing: true  # Search-R1 original
  use_remove_padding: true  # Search-R1 original

data:
  train_files: /data2/wuguanting/quick_loop/data/searchr1/train.parquet
  val_files: /data2/wuguanting/quick_loop/data/searchr1/test.parquet
  train_batch_size: 512  # Search-R1 original
  val_batch_size: 256  # Search-R1 original
  max_prompt_length: 4096  # Search-R1 original
  max_response_length: 500  # Search-R1 original, per generation turn
  max_start_length: 2048  # Search-R1 original
  max_information_length: 500  # Search-R1 max_obs_length
  shuffle: true  # Search-R1 original

algorithm:
  name: grpo
  advantage_estimator: grpo  # Search-R1 original
  group_size: 5  # Search-R1 rollout.n_agent
  use_kl_loss: true  # Search-R1 original
  kl_coefficient: 0.001  # Search-R1 original
  kl_type: low_var_kl  # Search-R1 original
  reward_normalization: group  # GRPO group normalization
  information_token_mask: true  # Search-R1 state_masking

actor:
  optimizer: adamw  # veRL default used by Search-R1
  learning_rate: 5.0e-7  # Search-R1 v0.3 original
  warmup_steps_ratio: 0.285  # Search-R1 original
  mini_batch_size: 256  # Search-R1 original
  micro_batch_size_per_gpu: 8  # changed for compatibility; original global micro batch 64
  clip_ratio: 0.2  # veRL default used by Search-R1
  grad_clip: 1.0  # veRL default used by Search-R1
  entropy_coefficient: 0.0  # veRL default used by Search-R1
  fsdp:
    param_offload: true  # Search-R1 original
    optimizer_offload: true  # Search-R1 original

rollout:
  engine: vllm  # Search-R1 original
  vllm_version: 0.10.0  # changed for Torch 2.7.1 compatibility
  tensor_model_parallel_size: 1  # Search-R1 original
  gpu_memory_utilization: 0.6  # Search-R1 original
  temperature: 1.0  # Search-R1 original
  top_p: 1.0  # explicit veRL default
  sampling: true
  log_prob_micro_batch_size: 128  # Search-R1 original

search:
  url: http://127.0.0.1:8000/search
  top_k: 3  # Search-R1 original
  max_actions: 4  # Search-R1 original

reward:
  type: final_answer_em
  correct_score: 1.0
  incorrect_score: 0.0
  format_bonus: 0.0  # changed: pure final-result reward requested
  retrieval_bonus: 0.0

reference:
  log_prob_micro_batch_size: 128  # Search-R1 original
  fsdp_param_offload: true  # Search-R1 original

trainer:
  n_gpus_per_node: 8  # Search-R1 original
  nnodes: 1
  checkpoint_interval: 100  # Search-R1 original
  evaluation_interval: 100  # Search-R1 original
  total_training_steps: 1005  # Search-R1 original
  logger: wandb
  project_name: ouro-search
  experiment_name: ouro-2.6b-r3-searchr1-grpo
  checkpoint_dir: outputs/checkpoints/grpo-r3

compatibility:
  search_r1_commit: 598e61bd1d36895726d28a8d06b3a15bed19f5d3
  verl_commit: ddd86f527a4af75095e4677b02b5aa272913a088
  vllm_version: 0.10.0
  transformers_version: 4.54.1
